<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <!-- Include Chessboard.js Styling -->
    <link rel="stylesheet" href="https://unpkg.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #161512; color: #bababa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .wrapper { display: flex; max-width: 1000px; width: 100%; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .board-container { flex: 1; min-width: 320px; max-width: 600px; }
        .sidebar { width: 340px; background-color: #262522; padding: 25px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #fff; margin-bottom: 20px; font-weight: 600; text-align: center; }
        .data-box { background-color: #312e2b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid #81b64c; }
        .data-label { font-size: 0.85rem; text-transform: uppercase; color: #7d7c7a; font-weight: bold; margin-bottom: 5px; }
        .data-value { font-size: 1.4rem; color: #fff; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; background-color: #81b64c; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #a3d96c; }
        button.secondary { background-color: #363532; color: #bababa; }
        button.secondary:hover { background-color: #454441; color: #fff; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Chessboard display -->
    <div class="board-container">
        <div id="board" style="width: 100%"></div>
    </div>

    <!-- Analytics Dashboard Sidebar -->
    <div class="sidebar">
        <div>
            <h2>Analysis Panel</h2>
            
            <div class="data-box">
                <div class="data-label">Side to Move</div>
                <div id="turn-display" class="data-value">White</div>
            </div>

            <div class="data-box" style="border-left-color: #4a90e2;">
                <div class="data-label">Engine Recommendation</div>
                <div id="best-move-display" class="data-value">Calculating...</div>
            </div>
        </div>

        <div class="btn-group">
            <button id="flip-btn" class="secondary">Flip Board</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>
</div>

<!-- Dependency Scripts -->
<script src="https://jquery.com"></script>
<script src="https://unpkg.com"></script>
<script src="https://cloudflare.com"></script>

<!-- Main App Logic -->
<script src="app.js"></script>
</body>
</html>
